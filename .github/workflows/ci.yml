name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install
        run: pip install -r agent/requirements.txt pytest httpx
      - name: Unit tests
        working-directory: agent
        run: pytest -q
      - name: Smoke test
        working-directory: agent
        run: |
          export SIFT_HOME=$(mktemp -d)
          uvicorn app:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 1
          done
          export SIFT_TOKEN=$(cat "$SIFT_HOME/token")
          python smoke.py
